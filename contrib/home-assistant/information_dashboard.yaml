#
# Information dashboard (/dashboard-information). Paste into the dashboard's
# three dots -> Edit dashboard -> three dots -> Raw configuration editor.
# Uses sensor.freezing_last_7_days (freeze_last_7_days.sql),
# sensor.freeze_forecast_14_days and sensor.snowfall_past_7_and_next_14_days
# (weather_rest.yaml) and the retry automation
# in information_automations.yaml.

title: Information
views:
  - title: Information
    path: information
    icon: mdi:information
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Freezing temperatures, last 7 days
            icon: mdi:snowflake-thermometer
          - type: markdown
            content: |-
              {% set n = states('sensor.freezing_last_7_days') | int(-1) %}{% set m = state_attr('sensor.freezing_last_7_days', 'freeze_minutes') | int(0) %}{% set ever = state_attr('sensor.freezing_last_7_days', 'last_freeze_ever') %}{% set since = state_attr('sensor.freezing_last_7_days', 'history_since') %}{% if n < 0 %}<center>Freeze tracking is unavailable right now.</center>{% else %}{% set d = m // 1440 %}{% set h = (m % 1440) // 60 %}{% set mm = m % 60 %}<center><font size="6"><b>{{ n }}</b></font><br>{{ 'time' if n == 1 else 'times' }} at or below 32 °F<br><br><font size="6"><b>{% if d %}{{ d }} d {% endif %}{% if d or h %}{{ h }} h {% endif %}{{ mm }} min</b></font><br>total time at or below 32 °F<br><br><b>Last time at or below 32 °F:</b><br>{% if ever %}{{ (ever | int | timestamp_local | as_datetime).strftime('%a %b %-d, %Y at %-I:%M %p') }}{% else %}none recorded{{ (' since ' ~ (since | int | timestamp_local | as_datetime).strftime('%b %-d, %Y')) if since else '' }}{% endif %}</center>{% endif %}<br><small>Rolling 7 days from the backyard 5-in-1 sensor. Now {{ states('sensor.acurite_5n1_c_364_temperature') | float(0) | round(1) }} °F.</small>
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Freezing forecast, today and the next 14 days
            icon: mdi:snowflake-alert
          - type: markdown
            content: |-
              {% set e = 'sensor.freeze_forecast_14_days' %}{% set tt = state_attr(e, 'time') or [] %}{% set vv = state_attr(e, 'temperature_2m') or [] %}{% set nowh = now().strftime('%Y-%m-%dT%H:00') %}{% set today = now().strftime('%a %b %-d') %}{% set ns = namespace(h=[], cold=none, days=[]) %}{% for i in range(tt | length) if tt[i] >= nowh and vv[i] is number %}{% set dt = strptime(tt[i], '%Y-%m-%dT%H:%M') %}{% set row = {'i': i, 'date': dt.strftime('%a %b %-d'), 'time': dt.strftime('%-I %p'), 'temp': vv[i] | round(0) | int} %}{% if ns.cold is none or vv[i] < ns.cold.temp %}{% set ns.cold = row %}{% endif %}{% if vv[i] <= 32 %}{% set ns.h = ns.h + [row] %}{% if row.date not in ns.days %}{% set ns.days = ns.days + [row.date] %}{% endif %}{% endif %}{% endfor %}{% macro windows(rows) %}{% set w = namespace(out=[], start=none, prev=none) %}{% for r in rows %}{% if w.prev is not none and r.i != w.prev.i + 1 %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% set w.start = r %}{% elif w.start is none %}{% set w.start = r %}{% endif %}{% set w.prev = r %}{% endfor %}{% if w.start is not none %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% endif %}{{ w.out | join(', ') }}{% endmacro %}{% if not tt %}<center>Forecast unavailable right now; it retries every 15 minutes.</center>{% else %}{% set th = ns.h | selectattr('date', 'eq', today) | list %}<b>Today ({{ today }}):</b> {% if th %}freezing expected {{ windows(th) }}, low {{ th | map(attribute='temp') | min }} °F{% else %}no freezing expected{% endif %}<br><br>{% if ns.days %}<b>Days forecast at or below 32 °F:</b><table width="100%">{% for d in ns.days %}{% set dh = ns.h | selectattr('date', 'eq', d) | list %}<tr><td><b>{{ d }}</b></td><td>{{ windows(dh) }}</td><td align="right">low {{ dh | map(attribute='temp') | min }} °F</td></tr>{% endfor %}</table>{% else %}<b>No freezing temperatures forecast</b> in the next 14 days.{% endif %}{% if ns.cold %}<br><small>Coldest forecast hour: {{ ns.cold.temp }} °F, {{ ns.cold.date }} at {{ ns.cold.time }}.</small>{% endif %}{% endif %}<br><small>Open-Meteo hourly forecast for 14 days, refreshed once a day (last {{ relative_time(states[e].last_reported) if states[e] else 'never' }} ago).</small>
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Snowfall, last 7 days
            icon: mdi:snowflake
          - type: markdown
            content: |-
              {% set e = 'sensor.snowfall_past_7_and_next_14_days' %}{% set tt = state_attr(e, 'time') or [] %}{% set vv = state_attr(e, 'snowfall') or [] %}{% set nowh = now().strftime('%Y-%m-%dT%H:00') %}{% set today = now().strftime('%a %b %-d') %}{% macro amt(x) %}{{ 'trace' if x < 0.05 else (x | round(1)) ~ ' in' }}{% endmacro %}{% macro windows(rows) %}{% set w = namespace(out=[], start=none, prev=none) %}{% for r in rows %}{% if w.prev is not none and r.i != w.prev.i + 1 %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% set w.start = r %}{% elif w.start is none %}{% set w.start = r %}{% endif %}{% set w.prev = r %}{% endfor %}{% if w.start is not none %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% endif %}{{ w.out | join(', ') }}{% endmacro %}{% set start = (now() - timedelta(days=7)).strftime('%Y-%m-%dT%H:00') %}{% set ns = namespace(h=[], days=[], total=0, runs=0, previ=-5) %}{% for i in range(tt | length) if tt[i] >= start and tt[i] < nowh and vv[i] is number and vv[i] > 0 %}{% set dt = strptime(tt[i], '%Y-%m-%dT%H:%M') %}{% set row = {'i': i, 'date': dt.strftime('%a %b %-d'), 'time': dt.strftime('%-I %p'), 'v': vv[i]} %}{% set ns.h = ns.h + [row] %}{% set ns.total = ns.total + vv[i] %}{% if i != ns.previ + 1 %}{% set ns.runs = ns.runs + 1 %}{% endif %}{% set ns.previ = i %}{% if row.date not in ns.days %}{% set ns.days = ns.days + [row.date] %}{% endif %}{% endfor %}{% if not tt %}<center>Snowfall data unavailable right now; it retries every 15 minutes.</center>{% else %}<center><font size="6"><b>{{ ns.runs }}</b></font><br>{{ 'snowfall' if ns.runs == 1 else 'snowfalls' }} in the last 7 days<br><br><font size="6"><b>{{ amt(ns.total) if ns.runs else '0 in' }}</b></font><br>total snow</center>{% if ns.h %}{% set last = ns.h[-1] %}<br><b>Last snowfall:</b> {{ last.date }}, ended about {{ last.time }}<table width="100%">{% for d in ns.days %}{% set dh = ns.h | selectattr('date', 'eq', d) | list %}<tr><td><b>{{ d }}</b></td><td>{{ windows(dh) }}</td><td align="right">{{ amt(dh | map(attribute='v') | sum) }}</td></tr>{% endfor %}</table>{% else %}{% set hs = states('sensor.snowfall_history_365_days') %}{% set ht = state_attr('sensor.snowfall_history_365_days', 'time') or [] %}{% set hv = state_attr('sensor.snowfall_history_365_days', 'snowfall_sum') or [] %}{% set hn = namespace(v=none) %}{% for k in range(ht | length) if ht[k] == hs %}{% set hn.v = hv[k] %}{% endfor %}<br><center><b>Last snowfall:</b> {% if hn.v is not none %}{{ strptime(hs, '%Y-%m-%d').strftime('%a %b %-d, %Y') }} ({{ amt(hn.v) }}){% elif hs == 'none' %}none in the past year{% else %}unknown right now{% endif %}</center>{% endif %}{% endif %}<br><small>Estimated by Open-Meteo for this location (the weather station has no snow gauge).</small>
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Snowfall forecast, today and the next 14 days
            icon: mdi:weather-snowy-heavy
          - type: markdown
            content: |-
              {% set e = 'sensor.snowfall_past_7_and_next_14_days' %}{% set tt = state_attr(e, 'time') or [] %}{% set vv = state_attr(e, 'snowfall') or [] %}{% set nowh = now().strftime('%Y-%m-%dT%H:00') %}{% set today = now().strftime('%a %b %-d') %}{% macro amt(x) %}{{ 'trace' if x < 0.05 else (x | round(1)) ~ ' in' }}{% endmacro %}{% macro windows(rows) %}{% set w = namespace(out=[], start=none, prev=none) %}{% for r in rows %}{% if w.prev is not none and r.i != w.prev.i + 1 %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% set w.start = r %}{% elif w.start is none %}{% set w.start = r %}{% endif %}{% set w.prev = r %}{% endfor %}{% if w.start is not none %}{% set w.out = w.out + [w.start.time if w.start.i == w.prev.i else w.start.time ~ ' to ' ~ w.prev.time] %}{% endif %}{{ w.out | join(', ') }}{% endmacro %}{% set ns = namespace(h=[], days=[], total=0) %}{% for i in range(tt | length) if tt[i] >= nowh and vv[i] is number and vv[i] > 0 %}{% set dt = strptime(tt[i], '%Y-%m-%dT%H:%M') %}{% set row = {'i': i, 'date': dt.strftime('%a %b %-d'), 'time': dt.strftime('%-I %p'), 'v': vv[i]} %}{% set ns.h = ns.h + [row] %}{% set ns.total = ns.total + vv[i] %}{% if row.date not in ns.days %}{% set ns.days = ns.days + [row.date] %}{% endif %}{% endfor %}{% if not tt %}<center>Snowfall forecast unavailable right now; it retries every 15 minutes.</center>{% else %}{% set th = ns.h | selectattr('date', 'eq', today) | list %}<b>Today ({{ today }}):</b> {% if th %}snow expected {{ windows(th) }}, {{ amt(th | map(attribute='v') | sum) }}{% else %}no snow expected{% endif %}<br><br>{% if ns.days %}<b>Days with snow forecast:</b><table width="100%">{% for d in ns.days %}{% set dh = ns.h | selectattr('date', 'eq', d) | list %}<tr><td><b>{{ d }}</b></td><td>{{ windows(dh) }}</td><td align="right">{{ amt(dh | map(attribute='v') | sum) }}</td></tr>{% endfor %}</table><br><b>Total forecast:</b> {{ amt(ns.total) }} over the next 14 days{% else %}<b>No snow forecast</b> in the next 14 days.{% endif %}{% endif %}<br><small>Open-Meteo hourly forecast for 14 days, refreshed once a day (last {{ relative_time(states[e].last_reported) if states[e] else 'never' }} ago).</small>
            grid_options:
              columns: 12
              rows: auto
