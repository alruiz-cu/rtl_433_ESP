# Automations for the Information dashboard. Paste into Settings ->
# Automations -> Create automation -> three dots -> Edit in YAML.

- alias: "Freeze forecast: retry when it has no data"
  description: >-
    The freeze and snowfall forecasts and the snowfall history refresh once a day. If a fetch
    fails it would stay empty for a day, so retry every 15 minutes while
    either has no data.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: template
      value_template: >-
        {{ not state_attr('sensor.freeze_forecast_14_days', 'time')
           or not state_attr('sensor.snowfall_past_7_and_next_14_days', 'time')
           or not state_attr('sensor.snowfall_history_365_days', 'time') }}
  actions:
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.freeze_forecast_14_days
          - sensor.snowfall_past_7_and_next_14_days
          - sensor.snowfall_history_365_days
