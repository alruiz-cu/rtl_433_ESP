# Free weather feeds that need no API key. Added 2026-11-03 for the Weather
# dashboard. Lives on Home Assistant as /homeassistant/weather_rest.yaml and is
# loaded by this line in configuration.yaml (needs a full HA restart to load):
#   rest: !include weather_rest.yaml
# Replace LAT and LON (4 decimals, e.g. 39.1234 and -104.1234) with the home
# location from Settings -> System -> General before copying to HA.

# NWS active alerts for this point (api.weather.gov asks for a User-Agent).
# Use 'No alerts', never the word None: HA turns a template result of None into
# 'unknown'.
- resource: "https://api.weather.gov/alerts/active?point=LAT,LON"
  headers:
    User-Agent: "home-assistant-weather-dashboard"
    Accept: "application/geo+json"
  scan_interval: 300
  timeout: 20
  sensor:
    - name: "NWS alert count"
      unique_id: nws_alert_count
      icon: mdi:alert
      value_template: "{{ value_json.features | length }}"
    - name: "NWS alerts"
      unique_id: nws_alert_events
      icon: mdi:alert-octagon
      value_template: >-
        {% set e = value_json.features | map(attribute='properties.event') | unique | join(', ') %}
        {{ (e if e else 'No alerts')[:250] }}
    - name: "NWS alert headline"
      unique_id: nws_alert_headline
      icon: mdi:alert-circle-outline
      value_template: >-
        {% set h = value_json.features | map(attribute='properties.headline') | first | default('') %}
        {{ (h if h else 'No alerts')[:250] }}

# Open-Meteo air quality (US AQI, PM2.5, ozone) for this point.
- resource: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=LAT&longitude=LON&current=us_aqi,pm2_5,ozone&timezone=auto"
  scan_interval: 1800
  timeout: 20
  sensor:
    - name: "Air quality index"
      unique_id: open_meteo_us_aqi
      device_class: aqi
      state_class: measurement
      value_template: "{{ value_json.current.us_aqi }}"
    - name: "PM2.5"
      unique_id: open_meteo_pm25
      device_class: pm25
      state_class: measurement
      unit_of_measurement: "µg/m³"
      value_template: "{{ value_json.current.pm2_5 }}"
    - name: "Ozone"
      unique_id: open_meteo_ozone
      device_class: ozone
      state_class: measurement
      unit_of_measurement: "µg/m³"
      value_template: "{{ value_json.current.ozone }}"

# Shade board (ESPSomfy-RTS) firmware version and update status, from its web API.
- resource: "http://192.168.1.38/controller"
  scan_interval: 3600
  timeout: 20
  sensor:
    - name: "Shade board firmware"
      unique_id: shade_board_firmware
      icon: mdi:chip
      value_template: "{{ value_json.version.fwVersion.name }}"
      json_attributes_path: "$.version"
      json_attributes:
        - latest
        - available

# Open-Meteo 14-day hourly temperature for the Information dashboard's freeze
# forecast (NWS only forecasts about 7 days). Refreshed once a day and at start.
# State = number of days with any hour at or below 32 F; attributes "time" and
# "temperature_2m" are the hourly forecast (local time, deg F).
- resource: "https://api.open-meteo.com/v1/forecast?latitude=LAT&longitude=LON&hourly=temperature_2m&temperature_unit=fahrenheit&timezone=auto&forecast_days=14"
  scan_interval: 86400
  timeout: 30
  sensor:
    - name: "Freeze forecast 14 days"
      unique_id: freeze_forecast_14_days
      icon: mdi:snowflake-alert
      value_template: >-
        {% set t = value_json.hourly.time %}{% set v = value_json.hourly.temperature_2m %}{% set ns = namespace(days=[]) %}{% for i in range(t | length) if v[i] is number and v[i] <= 32 and t[i][:10] not in ns.days %}{% set ns.days = ns.days + [t[i][:10]] %}{% endfor %}{{ ns.days | length }}
      json_attributes_path: "$.hourly"
      json_attributes:
        - time
        - temperature_2m

# Open-Meteo hourly snowfall (inches) for the past 7 days and the next 14, for
# the Information dashboard. The 5-in-1 has no snow gauge, so the past 7 days
# are Open-Meteo's estimate, not a measurement. Refreshed once a day and at
# start. State = forecast snowfall total (in) from now on; attributes "time"
# and "snowfall" are the hourly values (local time).
- resource: "https://api.open-meteo.com/v1/forecast?latitude=LAT&longitude=LON&hourly=snowfall&precipitation_unit=inch&timezone=auto&past_days=7&forecast_days=14"
  scan_interval: 86400
  timeout: 30
  sensor:
    - name: "Snowfall past 7 and next 14 days"
      unique_id: snowfall_past_7_next_14
      icon: mdi:snowflake
      unit_of_measurement: "in"
      value_template: >-
        {% set t = value_json.hourly.time %}{% set v = value_json.hourly.snowfall %}{% set nowh = now().strftime('%Y-%m-%dT%H:00') %}{% set ns = namespace(s=0) %}{% for i in range(t | length) if t[i] >= nowh and v[i] is number %}{% set ns.s = ns.s + v[i] %}{% endfor %}{{ ns.s | round(2) }}
      json_attributes_path: "$.hourly"
      json_attributes:
        - time
        - snowfall

# Open-Meteo historical daily snowfall (inches) for the past 365 days, so the
# Information dashboard can show the last snowfall even when it was months ago.
# Estimated for this location (no snow gauge). Refreshed once a day.
# State = date of the last day with snowfall (YYYY-MM-DD) or "none".
- resource_template: "https://archive-api.open-meteo.com/v1/archive?latitude=LAT&longitude=LON&start_date={{ (now() - timedelta(days=365)).strftime('%Y-%m-%d') }}&end_date={{ now().strftime('%Y-%m-%d') }}&daily=snowfall_sum&precipitation_unit=inch&timezone=auto"
  scan_interval: 86400
  timeout: 60
  sensor:
    - name: "Snowfall history 365 days"
      unique_id: snowfall_history_365_days
      icon: mdi:snowflake-melt
      value_template: >-
        {% set t = value_json.daily.time %}{% set v = value_json.daily.snowfall_sum %}{% set ns = namespace(last='none') %}{% for i in range(t | length) if v[i] is number and v[i] > 0 %}{% set ns.last = t[i] %}{% endfor %}{{ ns.last }}
      json_attributes_path: "$.daily"
      json_attributes:
        - time
        - snowfall_sum
